---
# EXPERIMENTAL — DO NOT DEPLOY. See ../research/icv-crew.md.
# Cloudflare blocks Prowlarr and ByParr currently times out resolving it.
id: icvcrew
name: iCV-CreW
description: "EXPERIMENTAL/BLOCKED: Cloudflare prevents reliable Prowlarr access."
language: it-IT
type: semi-private
encoding: UTF-8
links:
  - https://www.icv-crew.com/forum/

caps:
  categorymappings:
    - {id: 102, cat: TV, desc: "Serie TV - High definition H.264", default: true}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]

settings:
  - name: username
    type: text
    label: Username
  - name: password
    type: password
    label: Password
  - name: info_cloudflare
    type: info
    label: Cloudflare / ByParr
    default: "Blocked: direct requests are challenged and ByParr currently times out. Do not deploy."

# iCV-CreW is SMF 2.1.  The normal login form carries the current session
# token as hidden fields; method=form preserves them when submitting login2.
login:
  path: /forum/index.php?action=login
  method: form
  form: form#frmLogin
  inputs:
    user: "{{ .Config.username }}"
    passwrd: "{{ .Config.password }}"
    cookielength: -1
  test:
    path: /forum/index.php
    selector: a[href*="action=logout"]

# Searches return one result per forum topic.  This is intentional: it is
# reliable for films and season packs.  A topic with multiple episode magnets
# cannot be expanded into separate Torznab releases by Cardigann; see the
# local operational note before enabling it for episodic searches.
search:
  paths:
    - path: /forum/index.php?action=search2
      method: post
  inputs:
    search: "{{ if .Keywords }}{{ .Keywords }}{{ else }}{{ .Today.Year }}{{ end }}"
    searchtype: 1
    subject_only: 1
    sort: relevance
    show_complete: 1
    advanced: 1
    $raw: "{{ range .Categories }}&brd[{{.}}]=1{{end}}"
  rows:
    selector: .search_results .windowbg, .search_results .windowbg2, .search_results .windowbg3
    filters:
      - name: andmatch
  fields:
    category:
      selector: a[href*="board="]
      attribute: href
      filters:
        - name: regexp
          args: "board=(\\d+)"
    title:
      selector: a[href*="topic="]
      filters:
        - name: re_replace
          args: ["(?i)\\bStagion[ei] (\\d{1,3})\\b", "S$1"]
    details:
      selector: a[href*="topic="]
      attribute: href
    download:
      selector: a[href*="topic="]
      attribute: href
    date:
      selector: .smalltext
      optional: true
      filters:
        - name: timeago

download:
  before:
    pathselector:
      selector: a[href*="action=thank;msg="]
      attribute: href
  selectors:
    - selector: a[href^="magnet:?xt="]
      attribute: href
      filters:
        - name: htmldecode
        - name: re_replace
          args: ["\\n", ""]
# engine cardigann
