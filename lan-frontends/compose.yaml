# LAN Frontends Stack
# Minimal private frontends behind Nginx Proxy Manager.

name: lan-frontends

services:
  universo-web:
    image: ghcr.io/alsd4git/universo-gym-client:main
    container_name: universo-web
    restart: unless-stopped
    networks:
      - npm_network

  dovesonole18:
    image: ghcr.io/alsd4git/dovesonole18:main
    container_name: dovesonole18
    restart: unless-stopped
    networks:
      - npm_network

networks:
  npm_network:
    name: npm_network
    external: true
