# Dockpeek Stack
# Docker container overview via a read-only socket proxy.

name: dockpeek

services:
  dockpeek:
    image: ghcr.io/dockpeek/dockpeek:latest
    container_name: dockpeek
    restart: unless-stopped
    depends_on:
      - dockpeek-socket-proxy
    environment:
      - SECRET_KEY=${DOCKPEEK_SECRET_KEY}
      - USERNAME=${DOCKPEEK_USERNAME}
      - PASSWORD=${DOCKPEEK_PASSWORD}
      - DOCKER_HOST=tcp://dockpeek-socket-proxy:2375
    ports:
      - 3420:8000 # Web UI (direct host mapping)

  dockpeek-socket-proxy:
    image: linuxserver/socket-proxy:latest
    container_name: dockpeek-socket-proxy
    restart: unless-stopped
    read_only: true
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - PING=1
      - VERSION=1
      - LOG_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run
